# Builds the Android app on GitHub's machines and publishes the APK on the
# repo's Releases page. Run it from the Actions tab ("Run workflow"), or it runs
# by itself when anything in mobile/ changes on main.
name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]

permissions:
  contents: write # needed to create the release with the APK

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://caregiver-flame.vercel.app
      EXPO_PUBLIC_APP_KEY: ${{ secrets.APP_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the app key secret is set
        run: |
          if [ -z "$EXPO_PUBLIC_APP_KEY" ]; then
            echo "::error::Add the APP_KEY secret (same value as APP_KEY on Vercel) under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! printf '%s' "$EXPO_PUBLIC_APP_KEY" | grep -qE '^[A-Za-z0-9_-]+$'; then
            echo "::error::The APP_KEY secret contains spaces, line breaks, or symbols the app can't send. Change APP_KEY to letters and numbers only, in both GitHub and Vercel, then redeploy Vercel and run this again."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # Signed with the standard test key, so it installs directly on a phone
      # and each new build updates the previous one. Google Play needs a
      # separate upload key; set that up before the first store release.
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=paperwork-explainer-test-${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "test-build-${{ github.run_number }}" "$APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Test build ${{ github.run_number }}" \
            --notes "Android test build from commit ${{ github.sha }}. Download the .apk below on your phone to install." \
            --prerelease
